<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Obr</title>
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body>
    <div id="login" class="login-panel" hidden>
      <form id="login-form" class="login-card">
        <h1>Obr</h1>
        <label>
          Username
          <input id="username" name="username" autocomplete="username">
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password">
        </label>
        <button type="submit">Log in</button>
        <p id="login-error" class="error" hidden>Login failed.</p>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <button class="brand" data-view="day">Obr</button>
        <nav>
          <button data-view="day">Day</button>
          <button data-view="find">Find</button>
          <button data-view="todo">Todo</button>
          <button data-view="rss">RSS</button>
          <button id="logout-button" type="button">Logout</button>
        </nav>
      </header>

      <main>
        <section id="day-view" class="view">
          <form id="entry-form" class="panel">
            <textarea id="entry-text" rows="12" placeholder="Write a memo..."></textarea>
            <input id="entry-page" placeholder="Link page, optional">
            <input id="entry-links" placeholder="Tags / links, comma separated">
            <div class="toolbar">
              <label class="file-button">
                Photo
                <input id="entry-image-file" type="file" accept="image/*">
              </label>
              <button id="entry-reset" type="button">Reset</button>
              <button id="entry-save" type="submit">Save</button>
            </div>
            <img id="entry-preview" class="preview" hidden>
            <p id="entry-status" class="status" hidden></p>
          </form>
        </section>

        <section id="find-view" class="view" hidden>
          <form id="search-form" class="search-bar">
            <input id="search-input" placeholder="Search markdown">
            <button type="submit">Search</button>
          </form>
          <div id="search-results" class="panel list-panel"></div>
        </section>

        <section id="rss-view" class="view" hidden>
          <div class="panel">
            <h2>RSS</h2>
            <p>RSS is not implemented in the Rust rewrite yet.</p>
          </div>
        </section>

        <section id="page-view" class="view" hidden>
          <div class="page-actions">
            <button id="back-button">Back</button>
            <button id="edit-button">Edit</button>
          </div>
          <article class="panel">
            <h2 id="page-title"></h2>
            <div id="page-content" class="markdown"></div>
            <textarea id="page-editor" rows="22" hidden></textarea>
          </article>
        </section>
      </main>
    </div>

    <script src="/assets/app.js"></script>
  </body>
</html>
