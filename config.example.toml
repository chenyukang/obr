listen = "127.0.0.1:8010"
vault_path = "vault"
daily_dir = "Daily"
entry_dir = "Posts"
image_dir = "Pics"
todo_path = "Posts/todo.md"
log_path = "logs/obr.log"
# Simple levels work here: "trace", "debug", "info", "warn", "error".
# Full tracing filters also work, for example: "obr=debug".
log_level = "info"
username = "admin"
# Generate interactively with:
#   ./target/release/obr hash-password
# Then paste the generated line here:
# password_hash = "$argon2id$..."
# Plaintext passwords are disabled by default. Only set this to true for throwaway local development.
allow_plaintext_password = false
session_days = 21
# Keep false for plain http://127.0.0.1 local development.
# Set true when Obr is served through HTTPS, for example behind Tailscale Serve/Funnel or a reverse proxy.
secure_cookies = false
auto_git_sync = false

# Passkeys/WebAuthn. Keep RP ID stable; changing it invalidates registered passkeys.
passkey_store_path = "data/passkeys.json"
webauthn_rp_name = "Obr"
# Defaults to http://localhost:<listen-port> for local development.
# For phone/browser use, set these to your HTTPS origin, e.g.:
# webauthn_rp_id = "obr.example.com"
# webauthn_origin = "https://obr.example.com"
