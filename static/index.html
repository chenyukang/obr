<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Obr</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body>
    <div id="login" class="login-panel" hidden>
      <form id="login-form" class="login-card">
        <h1>Obr</h1>
        <div id="password-login-fields" class="password-login-fields">
          <label>
            Username
            <input id="username" name="username" autocomplete="username">
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password">
          </label>
          <button id="password-login-button" type="submit" data-icon="log-in">Log in</button>
        </div>
        <button id="passkey-login-button" type="button" data-icon="key" hidden>Log in with passkey</button>
        <p id="login-error" class="error" hidden>Login failed.</p>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <button class="brand" data-view="day" data-icon="book-open">Obr</button>
        <div class="topbar-right">
          <nav>
            <button data-view="day" data-icon="calendar-days">Day</button>
            <button data-view="find" data-icon="search">Find</button>
            <button data-view="todo" data-icon="list-checks">Todo</button>
          </nav>
          <div class="auth-actions">
            <button id="passkey-register-button" type="button" aria-label="Register passkey" title="Register passkey" data-icon="key" hidden></button>
            <button id="logout-button" type="button" aria-label="Log out" title="Log out" data-icon="log-out"></button>
          </div>
        </div>
      </header>

      <main>
        <section id="day-view" class="view">
          <form id="entry-form" class="panel">
            <textarea id="entry-text" rows="12" placeholder="Write a memo..."></textarea>
            <input id="entry-page" placeholder="Link page, optional">
            <input id="entry-links" placeholder="Tags / links, comma separated">
            <div class="toolbar">
              <label class="file-button" data-icon="image">
                Photo
                <input id="entry-image-file" type="file" accept="image/*">
              </label>
              <button id="entry-reset" type="button" data-icon="rotate-ccw">Reset</button>
              <button id="entry-save" type="submit" data-icon="save">Save</button>
            </div>
            <img id="entry-preview" class="preview" hidden>
            <p id="entry-status" class="status" hidden></p>
          </form>
        </section>

        <section id="find-view" class="view" hidden>
          <form id="search-form" class="search-bar">
            <div class="search-field">
              <input id="search-input" type="search" placeholder="Search markdown" autocomplete="off">
              <button id="search-clear" class="input-clear" type="button" aria-label="Clear search" title="Clear search" data-icon="x" hidden></button>
            </div>
            <button type="submit" data-icon="search">Search</button>
          </form>
          <div id="search-results" class="panel list-panel"></div>
        </section>

        <section id="todo-view" class="view" hidden>
          <form id="todo-form" class="todo-form">
            <input id="todo-input" placeholder="New todo">
            <button type="submit" data-icon="plus">Add</button>
          </form>
          <div id="todo-list" class="panel markdown todo-list"></div>
          <p id="todo-status" class="status" hidden></p>
        </section>

        <section id="page-view" class="view" hidden>
          <div class="page-actions">
            <button id="back-button" data-icon="arrow-left">Back</button>
            <button id="edit-button" data-icon="pencil">Edit</button>
          </div>
          <article class="panel">
            <h2 id="page-title"></h2>
            <div id="page-content" class="markdown"></div>
            <textarea id="page-editor" rows="22" hidden></textarea>
          </article>
        </section>
      </main>

    </div>

    <script src="/assets/app.js"></script>
  </body>
</html>
