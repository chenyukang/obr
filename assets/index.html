<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Obr</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#eef5f3">
    <link rel="stylesheet" href="/assets/style.css?v=20260521-mobile-command">
  </head>
  <body>
    <div id="boot" class="boot-screen" role="status" aria-live="polite">
      <span class="boot-mark" aria-hidden="true"></span>
      <span>Opening Obr...</span>
    </div>

    <div id="login" class="login-panel" hidden>
      <form id="login-form" class="login-card">
        <h1>Obr</h1>
        <div id="password-login-fields" class="password-login-fields">
          <label>
            Username
            <input id="username" name="username" autocomplete="username">
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password">
          </label>
          <button id="password-login-button" type="submit" data-icon="log-in">Log in</button>
        </div>
        <button id="passkey-login-button" type="button" data-icon="key" hidden>Log in with passkey</button>
        <p id="login-error" class="error" role="alert" hidden>Login failed.</p>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <button class="brand" data-view="day" data-icon="book-open">Obr</button>
        <div class="topbar-right">
          <nav>
            <button data-view="day" data-icon="calendar-days">Day</button>
            <button data-view="find" data-icon="search">Find</button>
            <button data-view="todo" data-icon="list-checks">Todo</button>
          </nav>
          <div class="auth-actions">
            <div id="connection-status" class="connection-status is-offline" role="status" aria-live="polite" title="Offline">
              <span class="connection-dot" aria-hidden="true"></span>
              <span id="connection-label" class="connection-label">Offline</span>
            </div>
            <button id="command-button" type="button" aria-label="Open command palette" title="Command" data-icon="command"></button>
            <button id="outbox-button" class="outbox-button" type="button" data-icon="list-checks" aria-label="Show pending sync items" title="Pending sync items" hidden>0</button>
            <button id="passkey-register-button" type="button" aria-label="Register passkey" title="Register passkey" data-icon="key" hidden></button>
            <button id="logout-button" type="button" aria-label="Log out" title="Log out" data-icon="log-out"></button>
          </div>
        </div>
      </header>
      <button id="update-banner" class="update-banner" type="button" data-icon="rotate-ccw" hidden>
        New version ready
      </button>
      <div id="reading-progress" class="reading-progress" aria-hidden="true" hidden><span></span></div>
      <section id="outbox-panel" class="outbox-panel" aria-label="Pending sync items" hidden>
        <div class="outbox-header">
          <div>
            <h2>Pending sync</h2>
            <p id="outbox-count">0 pending</p>
          </div>
          <div class="outbox-actions">
            <button id="outbox-retry" type="button" data-icon="rotate-ccw">Retry</button>
            <button id="outbox-close" type="button" aria-label="Close pending sync items" title="Close" data-icon="x"></button>
          </div>
        </div>
        <div id="outbox-list" class="outbox-list"></div>
      </section>
      <div id="command-palette" class="command-palette" hidden>
        <div class="command-dialog" role="dialog" aria-modal="true" aria-labelledby="command-title">
          <h2 id="command-title">Command</h2>
          <label class="sr-only" for="command-input">Command</label>
          <input id="command-input" type="search" placeholder="Type a command" autocomplete="off">
          <div id="command-list" class="command-list" role="listbox"></div>
        </div>
      </div>

      <main>
        <section id="day-view" class="view">
          <form id="entry-form" class="panel">
            <label class="sr-only" for="entry-text">Memo</label>
            <textarea id="entry-text" rows="12" placeholder="Write a memo..." aria-describedby="entry-status"></textarea>
            <details id="entry-meta" class="entry-meta">
              <summary>
                <span>Links & tags</span>
                <span id="entry-meta-count" class="entry-meta-count" hidden>0 filled</span>
              </summary>
              <div class="entry-meta-fields">
                <label class="sr-only" for="entry-page">Link page</label>
                <input id="entry-page" placeholder="Link page, optional" aria-describedby="entry-status">
                <label class="sr-only" for="entry-links">Tags and links</label>
                <input id="entry-links" placeholder="Tags / links, comma separated" aria-describedby="entry-status">
              </div>
            </details>
            <div class="toolbar">
              <label class="file-button" data-icon="image">
                Choose
                <input id="entry-image-file" type="file" accept="image/*">
              </label>
              <label class="file-button" data-icon="camera">
                Camera
                <input id="entry-camera-file" type="file" accept="image/*" capture="environment">
              </label>
              <button id="entry-reset" type="button" data-icon="rotate-ccw">Reset</button>
              <button id="entry-save" type="submit" data-icon="save">Save</button>
            </div>
            <img id="entry-preview" class="preview" hidden>
            <p id="entry-status" class="status" role="status" aria-live="polite" hidden></p>
          </form>
          <section id="recent-panel" class="recent-panel" aria-label="Recent pages and edits" hidden>
            <div class="recent-column">
              <h2>Recent pages</h2>
              <div id="recent-pages" class="recent-list"></div>
            </div>
            <div class="recent-column">
              <h2>Recent edits</h2>
              <div id="recent-edits" class="recent-list"></div>
            </div>
          </section>
        </section>

        <section id="find-view" class="view" hidden>
          <form id="search-form" class="search-bar">
            <div class="search-field">
              <label class="sr-only" for="search-input">Search keyword</label>
              <input id="search-input" type="search" placeholder="Keyword" autocomplete="off">
              <button id="search-clear" class="input-clear" type="button" aria-label="Clear search" title="Clear search" data-icon="x" hidden></button>
            </div>
            <button id="search-submit" type="submit" data-icon="search">Search</button>
          </form>
          <div id="search-results" class="panel list-panel" aria-live="polite"></div>
        </section>

        <section id="todo-view" class="view" hidden>
          <form id="todo-form" class="todo-form">
            <label class="sr-only" for="todo-input">New todo</label>
            <input id="todo-input" placeholder="New todo" aria-describedby="todo-status">
            <button type="submit" data-icon="plus">Add</button>
          </form>
          <div id="todo-list" class="panel markdown todo-list"></div>
          <p id="todo-status" class="status" role="status" aria-live="polite" hidden></p>
        </section>

        <section id="page-view" class="view" hidden>
          <div class="page-actions">
            <button id="back-button" data-icon="arrow-left">Back</button>
            <button id="edit-button" data-icon="pencil">Edit</button>
          </div>
          <article class="panel">
            <h2 id="page-title"></h2>
            <div id="page-content" class="markdown"></div>
            <label class="sr-only" for="page-editor">Page editor</label>
            <textarea id="page-editor" rows="22" aria-describedby="page-editor-status" hidden></textarea>
            <p id="page-editor-status" class="status" role="status" aria-live="polite" hidden></p>
          </article>
        </section>
      </main>

    </div>

    <button id="toc-button" class="toc-button" type="button" aria-label="Open page outline" title="Outline" data-icon="list" hidden></button>
    <div id="toc-panel" class="toc-panel" hidden>
      <div class="toc-sheet" role="dialog" aria-modal="true" aria-labelledby="toc-title">
        <div class="toc-header">
          <h2 id="toc-title">Outline</h2>
          <button id="toc-close" type="button" aria-label="Close outline" title="Close" data-icon="x"></button>
        </div>
        <div id="toc-list" class="toc-list"></div>
      </div>
    </div>

    <div id="image-lightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
      <div class="image-lightbox-toolbar">
        <button id="image-lightbox-zoom-out" type="button" aria-label="Zoom out" title="Zoom out" data-icon="minus"></button>
        <button id="image-lightbox-reset" type="button" aria-label="Reset zoom" title="Reset zoom" data-icon="rotate-ccw"></button>
        <button id="image-lightbox-zoom-in" type="button" aria-label="Zoom in" title="Zoom in" data-icon="plus"></button>
        <button id="image-lightbox-close" type="button" aria-label="Close image preview" title="Close" data-icon="x"></button>
      </div>
      <div id="image-lightbox-stage" class="image-lightbox-stage">
        <img id="image-lightbox-img" class="image-lightbox-img" alt="">
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/assets/app.js?v=20260521-mobile-command"></script>
  </body>
</html>
