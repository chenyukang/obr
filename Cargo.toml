[package]
name = "obr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first web companion for capturing, editing, and reading Obsidian notes from any browser."
license = "MIT"
repository = "https://github.com/chenyukang/obr"
readme = "README.md"

[dependencies]
ammonia = "4.1.2"
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
feed-rs = "2.3.1"
html2markdown = "0.2.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
mime_guess = "2.0"
notify = "8.2"
pulldown-cmark = "0.13.3"
rand = "0.9"
reqwest = "0.13.3"
rpassword = "7.4"
rs-trafilatura = "0.2.2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
tower-sessions = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
url = "2.5.8"
uuid = { version = "1.23.1", features = ["serde", "v4", "v5"] }
walkdir = "2.5"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
yaml_serde = "0.10.4"

[profile.dev.package.rs-trafilatura]
debug-assertions = false
