listen = "127.0.0.1:8010"
vault_path = "vault"
daily_dir = "Daily"
entry_dir = "Posts"
image_dir = "Pics"
todo_path = "Posts/todo.md"
annotation_dir = "annotations"
log_path = "logs/obr.log"
# Simple levels work here: "trace", "debug", "info", "warn", "error".
# Full tracing filters also work, for example: "obr=debug".
log_level = "info"
# Optional automatic dark-mode window. Times are interpreted in the browser/system local timezone.
# Configure both values or leave both commented out. Overnight ranges such as 21:00-07:00 are supported.
# dark_mode_start = "21:00"
# dark_mode_end = "07:00"
username = "admin"
# Generate interactively with:
#   ./target/release/obr hash-password
# Then paste the generated line here:
# password_hash = "$argon2id$..."
# Plaintext passwords are disabled by default. Only set this to true for throwaway local development.
allow_plaintext_password = false
session_days = 21
# Keep false for plain http://127.0.0.1 local development.
# Set true when Obr is served through HTTPS, for example behind Tailscale Serve/Funnel or a reverse proxy.
secure_cookies = false
auto_git_sync = false

# RSS reader. Feeds are read from a vault-relative Markdown file with one URL per line.
rss_enabled = false
rss_feeds_path = "Zero/feeds.md"
rss_data_dir = "data/rss"
rss_refresh_minutes = 30
rss_max_items_per_feed = 20
rss_fetch_full_content = true
rss_ai_summary_enabled = true
rss_ai_full_translation_enabled = false
rss_ai_summary_chars = 200
# Optional: enables Chinese summaries for newly fetched non-Chinese RSS posts.
# Full translation is off by default because it can materially increase API cost.
# Set rss_ai_full_translation_enabled = true to translate full posts during refresh.
# deepseek_api_key = "sk-..."
deepseek_api_base = "https://api.deepseek.com"
deepseek_model = "deepseek-v4-flash"

# Passkeys/WebAuthn. Keep RP ID stable; changing it invalidates registered passkeys.
passkey_store_path = "data/passkeys.json"
webauthn_rp_name = "Obr"
# Defaults to http://localhost:<listen-port> for local development.
# For phone/browser use, set this to your HTTPS hostname; the origin defaults
# to https://<webauthn_rp_id>.
# webauthn_rp_id = "obr.example.com"
